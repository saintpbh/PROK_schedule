    // ─── Helper: Generate 12-month template for a year ───────────────────
    const generateYearTemplate = (year) => {
      const months = [];
      for (let m = 1; m <= 12; m++) {
        months.push({
          id: `${String(m).padStart(2,'0')}-${year}`,
          title: `${year}년 ${m}월 일정`,
          rows: [{ id: `init_${year}_${m}_${Math.random().toString(36).substr(2,5)}`, date: '', time: '', title: '', dept: '' }]
        });
      }
      return months;
    };

    // ─── Helper: Fix broken prok.org image URLs ──────────────────────────
    const fixImageSrc = (src) => {
      if (!src) return src;
      if (src.includes('prok.org') && !src.includes('archive.prok.org')) {
        return src.replace(/(?:www\.)?prok\.org/g, 'archive.prok.org');
      }
      return src;
    };

    // ─── Helper: Attach image fallback to rendered HTML container ────────
    const attachImageFallback = (containerEl) => {
      if (!containerEl) return;
      const imgs = containerEl.querySelectorAll('img');
      imgs.forEach(img => {
        if (img.dataset.fallbackApplied) return;
        img.dataset.fallbackApplied = 'true';
        const originalSrc = img.src;
        img.onerror = () => {
          const fixed = fixImageSrc(originalSrc);
          if (fixed !== originalSrc && !img.dataset.fallbackTried) {
            img.dataset.fallbackTried = 'true';
            img.src = fixed;
          } else {
            img.style.display = 'none';
            const placeholder = document.createElement('div');
            placeholder.style.cssText = 'padding:20px;text-align:center;color:#94a3b8;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;margin:8px 0;font-size:13px;';
            placeholder.innerHTML = '<i class="fa-solid fa-image" style="font-size:24px;margin-bottom:8px;display:block;"></i>이미지를 불러올 수 없습니다';
            img.parentNode.insertBefore(placeholder, img.nextSibling);
          }
        };
        // Trigger check for already-broken images
        if (img.complete && img.naturalWidth === 0) {
          img.onerror();
        }
      });
    };

    // ─── Helper: Normalize Firebase data ─────────────────────────────────

      if (!data) return [];
      const arr = Array.isArray(data) ? data : Object.values(data);
      return arr.map(t => ({

        rows: Array.isArray(t.rows) ? t.rows : (t.rows ? Object.values(t.rows) : [])
      }));
    };

          { id: 'r18', date: '', time: '오전 10:30 ~ 오후 04:00', title: '여름 집필진 공동집필 워크숍(3차)', dept: '교재개발출판부' }

      },
      {

    // ─── Archive Management State ────────────────────────────────────────────
    const STORAGE_KEY = 'prok_archive_custom';

    const ArchiveView = ({ archivedSchedules = {}, isLoggedIn = false }) => {
      const [searchQuery, setSearchQuery] = useState('');
      const [year, setYear] = useState('all');
      const [category, setCategory] = useState('all');
      const [activePost, setActivePost] = useState(null);
      const [data, setData] = useState([]);
      const [activeTab, setActiveTab] = useState('history'); // 'history' | 'pastSchedules'
      const contentRef = useRef(null);

      // Admin state
      const [adminMode, setAdminMode] = useState(false);
      const [showAddForm, setShowAddForm] = useState(false);
      const [editingPost, setEditingPost] = useState(null);
      const [formData, setFormData] = useState({ title: '', date: '', dept: '총회장 동정', author: '', url: '', content: '' });
      const [brokenImageIds, setBrokenImageIds] = useState(() => {
        try {
          const stored = localStorage.getItem('brokenImageIds');
          return stored ? new Set(JSON.parse(stored)) : new Set();
        } catch {
          return new Set();
        }
      });
      const [isScanningImages, setIsScanningImages] = useState(false);
      const [scanProgress, setScanProgress] = useState({ total: 0, current: 0 });

      const scanBrokenImages = async () => {
        setIsScanningImages(true);
        const toScan = data.filter(d => d.content && d.content.includes('<img'));
        setScanProgress({ total: toScan.length, current: 0 });
        const brokenSet = new Set(brokenImageIds);

        for (let i = 0; i < toScan.length; i++) {
          const item = toScan[i];
          const srcRegex = /<img[^>]+src=["']([^"']+)["']/gi;
          let match;
          let isBroken = false;
          
          while ((match = srcRegex.exec(item.content)) !== null) {
            let testSrc = match[1];
            if (testSrc.includes('prok.org') && !testSrc.includes('archive.prok.org')) {
              testSrc = testSrc.replace(/(?:www\.)?prok\.org/g, 'archive.prok.org');
            }
            const imgOk = await new Promise((resolve) => {
              const tempImg = new Image();
              tempImg.onload = () => resolve(true);
              tempImg.onerror = () => resolve(false);
              tempImg.src = testSrc;
            });
            if (!imgOk) {
              isBroken = true;
              break;
            }
          }
          if (isBroken) brokenSet.add(item.id);
          
          setScanProgress({ total: toScan.length, current: i + 1 });
          if ((i + 1) % 5 === 0) {
            setBrokenImageIds(new Set(brokenSet));
            localStorage.setItem('brokenImageIds', JSON.stringify([...brokenSet]));
          }
        }
        setBrokenImageIds(new Set(brokenSet));
        localStorage.setItem('brokenImageIds', JSON.stringify([...brokenSet]));
        setIsScanningImages(false);
      };

      // Load base + custom overrides
      useEffect(() => {
        const base = window.HISTORY_DATA ? [...window.HISTORY_DATA] : [];
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          const customAdded = saved.added || [];
          const customDeleted = new Set(saved.deleted || []);
          const customEdited = saved.edited || {};
          const merged = base
            .filter(item => !customDeleted.has(item.id))
            .map(item => customEdited[item.id] ? { ...item, ...customEdited[item.id] } : item);
          setData([...customAdded, ...merged]);
        } catch {
          setData(base);
        }
      }, []);

      // Image fallback on post detail
      useEffect(() => {
        if (activePost && contentRef.current) {
          attachImageFallback(contentRef.current);
        }
      }, [activePost]);

      const persistCustom = (newData) => {
        const base = window.HISTORY_DATA ? [...window.HISTORY_DATA] : [];
        const baseIds = new Set(base.map(i => i.id));
        const added = newData.filter(i => !baseIds.has(i.id));
        const currentIds = new Set(newData.map(i => i.id));
        const deleted = base.filter(i => !currentIds.has(i.id)).map(i => i.id);
        const edited = {};
        newData.forEach(item => {
          if (baseIds.has(item.id)) {
            const orig = base.find(b => b.id === item.id);
            const diff = {};
            let hasDiff = false;
            ['title','date','dept','author','url','content'].forEach(k => {
              if (item[k] !== orig[k]) { diff[k] = item[k]; hasDiff = true; }
            });
            if (hasDiff) edited[item.id] = diff;
          }
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ added, deleted, edited }));
        setData(newData);
      };

      const availableYears = [...new Set(data.map(item => item.date.substring(0, 4)))].sort((a,b) => b.localeCompare(a));
      
      const filteredData = data.filter(item => {
        const matchYear = year === 'all' || item.date.startsWith(year);
        const matchSearch = item.title.includes(searchQuery) || item.dept.includes(searchQuery) || item.author?.includes(searchQuery);
        const matchCat = category === 'all' || item.dept === category;
        return matchYear && matchSearch && matchCat;
      }).sort((a, b) => b.date.localeCompare(a.date));

      const mockHistoricalEvents = [
        { id: 1, year: '1953', title: '한국기독교장로회 제38회 총회 창립', desc: '호헌총회로 모여 새 역사를 시작하다.', tag: '창립' },
        { id: 2, year: '1973', title: '한국기독교장로회 선언문 발표', desc: '제58회 총회, 시대를 향한 예언자적 목소리', tag: '선언' },
        { id: 3, year: '1987', title: '평화통일 희년선언', desc: '민족의 통일과 평화를 위한 원년', tag: '평화' },

      useEffect(() => {
        if (activePost || showAddForm || editingPost) document.body.style.overflow = 'hidden';
        else document.body.style.overflow = 'unset';
      }, [activePost, showAddForm, editingPost]);

      // ── CRUD handlers ──────────────────────────────────────────────────────
      const handleDelete = (id, e) => {
        e.stopPropagation();
        if (!confirm('이 항목을 삭제하시겠습니까?')) return;
        persistCustom(data.filter(i => i.id !== id));
      };

      const handleEditOpen = (post, e) => {
        e.stopPropagation();
        setEditingPost(post);
        setFormData({ title: post.title, date: post.date, dept: post.dept, author: post.author || '', url: post.url || '', content: post.content || '' });
      };

      const handleEditSave = () => {
        if (!formData.title || !formData.date) return addToast('제목과 날짜는 필수입니다.', 'error');
        persistCustom(data.map(i => i.id === editingPost.id ? { ...i, ...formData } : i));
        
        // Remove from broken image cache if edited
        const updatedBrokenSet = new Set(brokenImageIds);
        if (updatedBrokenSet.has(editingPost.id)) {
          updatedBrokenSet.delete(editingPost.id);
          setBrokenImageIds(updatedBrokenSet);
          localStorage.setItem('brokenImageIds', JSON.stringify([...updatedBrokenSet]));
        }
        
        setEditingPost(null);
      };

      const handleAddSave = () => {
        if (!formData.title || !formData.date) return addToast('제목과 날짜는 필수입니다.', 'error');
        const newId = `custom_${Date.now()}`;

        setShowAddForm(false);
        setFormData({ title: '', date: '', dept: '총회장 동정', author: '', url: '', content: '' });

      // ── Category badge color ───────────────────────────────────────────────

        if (dept === '총회장 동정' || dept === '총회문서') return 'bg-blue-50 text-blue-700 border border-blue-200';
        return 'bg-[#f1f4f6] text-[#444650]';
      };

      // ── Shared form fields ─────────────────────────────────────────────────
      const FormFields = () => (
        <div className="space-y-4">

                <option value="총회장 동정">총회장 동정</option>

              </select>
            </div>
          </div>

                  <h2 className="text-lg font-extrabold"><i className="fa-solid fa-pen mr-2"></i>기록 편집</h2>
                  <button onClick={() => setEditingPost(null)} className="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <div className="p-6 max-h-[75vh] overflow-y-auto">
                  <FormFields />
                  <div className="flex gap-3 mt-6 pt-4 border-t border-slate-100">
                    <button onClick={() => setEditingPost(null)} className="flex-1 py-3 rounded-xl border border-slate-200 text-slate-500 font-bold hover:bg-slate-50 transition-colors">취소</button>
                    <button onClick={handleEditSave} className="flex-1 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold transition-colors shadow">저장</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ═══════════════════════════════════════════════════════════════════════
    // ═══ Main App Component ══════════════════════════════════════════════
    // ═══════════════════════════════════════════════════════════════════════
    function App() {
      // ===== 🎯 UX Upgrades =====
      const [toasts, setToasts] = useState([]);
      const [darkMode, setDarkMode] = useState(false);
      const [dragOverRowInfo, setDragOverRowInfo] = useState(null);
      const [displayMode, setDisplayMode] = useState('list');
      
      const addToast = (message, type = 'success') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      React.useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginId, setLoginId] = useState('');
      const [loginPw, setLoginPw] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeTimeRow, setActiveTimeRow] = useState(null);
      const [viewMode, setViewMode] = useState('preview');
      const [currentTime, setCurrentTime] = useState(new Date());

      const [tables, setTables] = useState(initialData);
      const [copySuccess, setCopySuccess] = useState(false);
      const [copyHtmlSuccess, setCopyHtmlSuccess] = useState(false);
      const previewRef = useRef(null);

      // DaouOffice Settings
      const [showDaouSettings, setShowDaouSettings] = useState(false);
      const [daouUrl, setDaouUrl] = useState(() => localStorage.getItem('daou_url') || '');
      const [daouId, setDaouId] = useState(() => localStorage.getItem('daou_id') || '');
      const [daouPw, setDaouPw] = useState(() => localStorage.getItem('daou_pw') || '');
      const [proxyUrl, setProxyUrl] = useState(() => localStorage.getItem('vercel_proxy') || 'https://prok-schedule.vercel.app/api/proxy');
      const [isSyncing, setIsSyncing] = useState(false);

      // ── NEW: Multi-year state ──────────────────────────────────────────
      const [availableYears, setAvailableYears] = useState([]);
      const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
      const [displaySettings, setDisplaySettings] = useState({
        display_year: 2026, display_start: '2026-01-01', display_end: '2026-12-31'
      });
      const [showDisplaySettings, setShowDisplaySettings] = useState(false);
      const [showNewYearModal, setShowNewYearModal] = useState(false);
      const [newYearInput, setNewYearInput] = useState(new Date().getFullYear() + 1);
      const [showCsvYearModal, setShowCsvYearModal] = useState(false);
      const [csvTargetYear, setCsvTargetYear] = useState(new Date().getFullYear());
      const [undoSnapshot, setUndoSnapshot] = useState(null);
      const [showUndoToast, setShowUndoToast] = useState(false);
      const undoTimerRef = useRef(null);
      const [archivedSchedules, setArchivedSchedules] = useState({});
      const [archiveNotice, setArchiveNotice] = useState(null);

      // ── Timer ──────────────────────────────────────────────────────────
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // ── Auth listener ──────────────────────────────────────────────────
      useEffect(() => {
        const unsubscribe = firebase.auth().onAuthStateChanged((user) => {
          if (user) { setIsLoggedIn(true); setViewMode('edit'); }
          else { setIsLoggedIn(false); setViewMode('preview'); }
        });
        return () => unsubscribe();
      }, []);

      // ── Normalize tables ───────────────────────────────────────────────
      const safeTables = useMemo(() => {
        if (!Array.isArray(tables)) return [];
        return tables.map(t => ({ ...t, rows: Array.isArray(t.rows) ? t.rows : [] }));
      }, [tables]);

      const allTitles = useMemo(() => {
        return Array.from(new Set(safeTables.flatMap(t => t.rows.map(r => r.title)).filter(t => t && t.trim() !== '')));
      }, [safeTables]);

      const allDepts = useMemo(() => {
        return Array.from(new Set(safeTables.flatMap(t => t.rows.map(r => r.dept)).filter(d => d && d.trim() !== '')));
      }, [safeTables]);

      // ── DaouOffice functions (unchanged) ───────────────────────────────
      const fetchFromDaou = async () => {
        if (!daouUrl || !daouId || !daouPw) return addToast('설정에서 주소, 아이디, 비밀번호를 입력해주세요.');
        setIsSyncing(true);
        try {
          const auth = btoa(`${daouId}:${daouPw}`);
          const targetEndpoint = daouUrl.endsWith('/') ? `${daouUrl}.well-known/caldav` : `${daouUrl}/.well-known/caldav`;
          const endpointToFetch = proxyUrl ? `${proxyUrl}?url=${encodeURIComponent(targetEndpoint)}` : targetEndpoint;
          const response = await fetch(endpointToFetch, {
            method: 'PROPFIND',
            headers: { 'Authorization': `Basic ${auth}`, 'Depth': '0', 'Content-Type': 'application/xml; charset=utf-8' },
            body: `<?xml version="1.0" encoding="utf-8"?><d:propfind xmlns:d="DAV:"><d:prop><d:current-user-principal/></d:prop></d:propfind>`
          });
          if (!response.ok) {
            if (response.status === 401) throw new Error("401 Unauthorized - 아이디나 비밀번호를 다시 확인해주세요.");
            throw new Error(`서버 응답 오류: ${response.status}`);
          }
          addToast('연동(인증)에 성공했습니다!');
        } catch (e) {
          addToast(`통신 오류가 발생했습니다.\n\n상세 에러: ${e.message}`, 'error');
        } finally { setIsSyncing(false); }
      };
      const exportToDaou = async () => { addToast('내보내기 기능 준비 중입니다.'); };

      // ═══════════════════════════════════════════════════════════════════
      // ═══ MULTI-YEAR FIREBASE LOADING ══════════════════════════════════
      // ═══════════════════════════════════════════════════════════════════

      // Effect 1: One-time setup — migration, settings, available years, archived, auto-archive
      useEffect(() => {
        // Load display settings
        const settingsHandler = settingsRef.on('value', snap => {
          const s = snap.val();
          if (s) setDisplaySettings(s);
        });

        // Load available years
        const yearsHandler = schedulesBaseRef.on('value', snap => {
          const data = snap.val();
          if (data) {
            const years = Object.keys(data).map(Number).sort((a,b) => a - b);
            setAvailableYears(years);
          }
        });

        // Load archived schedules
        const archiveHandler = archivedRef.on('value', snap => {
          setArchivedSchedules(snap.val() || {});
        });

        // Migration: only run when authenticated (requires write permission)
        const runMigrationIfNeeded = () => {
          const user = firebase.auth().currentUser;
          if (!user) return; // Skip migration for non-authenticated users
          schedulesBaseRef.once('value', snap => {
            if (!snap.exists()) {
              legacyScheduleRef.once('value', legacySnap => {
                const legacyData = legacySnap.val();
                if (legacyData) {
                  const normalized = normalizeScheduleData(legacyData);
                  schedulesBaseRef.child('2026').set(normalized);
                  db.ref('shared_schedule_editor/data_backup_migrated').set(legacyData);
                  settingsRef.set({ display_year: 2026, display_start: '2026-01-01', display_end: '2026-12-31' });
                  console.log('[Migration] Legacy data migrated to schedules/2026');
                } else {
                  schedulesBaseRef.child('2026').set(initialData);
                  settingsRef.set({ display_year: 2026, display_start: '2026-01-01', display_end: '2026-12-31' });
                }
              });
            }
          });
        };
        // Listen for auth state to trigger migration
        const authUnsub = firebase.auth().onAuthStateChanged(user => {
          if (user) runMigrationIfNeeded();
        });

        // Auto-archiving: if current year > display_year
        const currentYear = new Date().getFullYear();
        settingsRef.once('value', snap => {
          const s = snap.val();
          if (s && s.display_year && currentYear > s.display_year) {
            const oldYear = s.display_year;
            schedulesBaseRef.child(String(oldYear)).once('value', oldSnap => {
              const oldData = oldSnap.val();
              if (oldData) {
                archivedRef.child(String(oldYear)).set(oldData);
                settingsRef.update({ display_year: currentYear });
                schedulesBaseRef.child(String(currentYear)).once('value', curSnap => {
                  if (!curSnap.exists()) {
                    schedulesBaseRef.child(String(currentYear)).set(generateYearTemplate(currentYear));
                  }
                });
                setArchiveNotice(`📦 ${oldYear}년 일정이 자동으로 아카이빙되었습니다.`);
                setTimeout(() => setArchiveNotice(null), 8000);
              }
            });
          }
        });

        return () => {
          settingsRef.off('value', settingsHandler);
          schedulesBaseRef.off('value', yearsHandler);
          archivedRef.off('value', archiveHandler);
          authUnsub();
        };
      }, []);

      // Effect 2: Load selected year's data from Firebase (with legacy fallback)
      useEffect(() => {
        const yearRef = schedulesBaseRef.child(String(selectedYear));
        const handler = yearRef.on('value', snap => {
          const data = snap.val();
          if (data) {
            setTables(normalizeScheduleData(data));
          } else {
            // Fallback: if schedules/{year} doesn't exist, try legacy data path
            legacyScheduleRef.once('value', legacySnap => {
              const legacyData = legacySnap.val();
              if (legacyData) {
                setTables(normalizeScheduleData(legacyData));
                console.log('[Fallback] Loaded from legacy data/ path');
              } else {
                setTables([]);
              }
            }).catch(() => setTables([]));
          }
        });
        return () => yearRef.off('value', handler);
      }, [selectedYear]);

      // Effect 3: For non-logged-in users, show display_year
      useEffect(() => {
        if (!isLoggedIn && displaySettings.display_year) {
          setSelectedYear(displaySettings.display_year);
        }
      }, [isLoggedIn, displaySettings.display_year]);

      // ── Save to Firebase (year-aware) ──────────────────────────────────
      const saveToDb = useCallback((newTables, year) => {
        const targetYear = year || selectedYear;
        setTables(newTables);
        schedulesBaseRef.child(String(targetYear)).set(newTables);
      }, [selectedYear]);

      // ── Create new year ────────────────────────────────────────────────
      const createNewYear = (year) => {
        if (availableYears.includes(year)) {
          return addToast(`${year}년 일정이 이미 존재합니다.`);
        }
        const template = generateYearTemplate(year);
        schedulesBaseRef.child(String(year)).set(template);
        setSelectedYear(year);
        setShowNewYearModal(false);
        addToast(`✅ ${year}년 일정 (12개월 템플릿)이 생성되었습니다.`);
      };

      // ── CSV Import (with year selection + undo) ────────────────────────
      const triggerCsvImport = () => {
        const csvData = window.CSV_SCHEDULE_2026;
        if (!csvData || !Array.isArray(csvData)) {
          return addToast('CSV 데이터가 로드되지 않았습니다.');
        }
        setCsvTargetYear(selectedYear);
        setShowCsvYearModal(true);
      };

      const executeCsvImport = (targetYear) => {
        const csvData = window.CSV_SCHEDULE_2026;
        if (!csvData) return;
        setShowCsvYearModal(false);

        // Save undo snapshot (current data before import)
        setUndoSnapshot({ year: targetYear, data: [...tables] });

        // Load target year data
        schedulesBaseRef.child(String(targetYear)).once('value', snap => {
          let existingTables = normalizeScheduleData(snap.val());

          const csvMonths = new Map();
          csvData.forEach(t => {
            const m = t.title.match(/(\d{1,2})월/);
            if (m) csvMonths.set(parseInt(m[1]), { ...t, title: t.title.replace(/\d{4}년/, `${targetYear}년`) });
          });

          let merged = existingTables.map(t => {
            const m = t.title.match(/(\d{1,2})월/);
            if (!m) return t;
            const monthNum = parseInt(m[1]);
            const csvVersion = csvMonths.get(monthNum);
            if (csvVersion) {
              if ((t.rows || []).length > (csvVersion.rows || []).length) {
                csvMonths.delete(monthNum);
                return t;
              }
              csvMonths.delete(monthNum);
              return csvVersion;
            }
            return t;
          });
          csvMonths.forEach(csvTable => merged.push(csvTable));
          merged.sort((a, b) => {
            const mA = a.title.match(/(\d{1,2})월/);
            const mB = b.title.match(/(\d{1,2})월/);
            if (mA && mB) return parseInt(mA[1]) - parseInt(mB[1]);
            return 0;
          });

          saveToDb(merged, targetYear);

          // Show undo toast
          setShowUndoToast(true);
          if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
          undoTimerRef.current = setTimeout(() => {
            setShowUndoToast(false);
            setUndoSnapshot(null);
          }, 30000);

          addToast(`✅ CSV 일정이 ${targetYear}년에 가져와졌습니다!`);
        });
      };

      // ── Undo ───────────────────────────────────────────────────────────
      const handleUndo = () => {
        if (!undoSnapshot) return;
        saveToDb(undoSnapshot.data, undoSnapshot.year);
        setUndoSnapshot(null);
        setShowUndoToast(false);
        if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
        addToast('✅ 이전 상태로 되돌리기 완료!');
      };

      // ── Save display settings ──────────────────────────────────────────
      const saveDisplaySettings = (newSettings) => {
        settingsRef.set(newSettings);
        setDisplaySettings(newSettings);
        setShowDisplaySettings(false);
        addToast('✅ 노출 설정이 저장되었습니다.');
      };

      // ── Table CRUD ─────────────────────────────────────────────────────
      const genId = () => Math.random().toString(36).substr(2, 9);

      const addTable = () => {
        let newTitle = `${selectedYear}년 새 일정`;
        if (tables.length > 0) {
          const lastTable = tables[tables.length - 1];
          const match = lastTable.title.match(/(\d{4})년\s*(\d{1,2})월/);
          if (match) {
            let year = parseInt(match[1], 10);
            let month = parseInt(match[2], 10) + 1;
            if (month > 12) { year += 1; month = 1; }
            newTitle = `${year}년 ${month}월 일정`;
          }
        }
        saveToDb([...tables, { id: genId(), title: newTitle, rows: [{ id: genId(), date: '', time: '', title: '', dept: '' }] }]);
      };

      const deleteTable = (id) => {
        if (confirm('이 표를 정말 삭제할까요?')) {
          saveToDb(tables.filter(t => t.id !== id));
        }
      };

      const setTitle = (id, title) => {
        saveToDb(tables.map(t => t.id === id ? { ...t, title } : t));
      };

      const addRow = (tableId, index, rowData = {}) => {
        const newId = genId();
        saveToDb(tables.map(t => {
          if (t.id === tableId) {
            const newRows = [...t.rows];
            newRows.splice(index + 1, 0, { id: newId, date: '', time: '', title: '', dept: '', ...rowData });
            return { ...t, rows: newRows };
          }
          return t;
        }));
        return newId;
      };

      const updateRow = (tableId, rowId, field, val) => {
        saveToDb(tables.map(t => {
          if (t.id === tableId) {
            return { ...t, rows: t.rows.map(r => r.id === rowId ? { ...r, [field]: val } : r) };
          }
          return t;
        }));
      };

      const deleteRow = (tableId, rowId) => {
        saveToDb(tables.map(t => {
          if (t.id === tableId) {
            return { ...t, rows: t.rows.filter(r => r.id !== rowId) };
          }
          return t;
        }));
      };

      const moveRow = (tableId, idx, dir) => {
        saveToDb(tables.map(t => {
          if (t.id === tableId) {
            const arr = [...t.rows];
            if (dir === 'up' && idx > 0) { [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]]; }
            else if (dir === 'down' && idx < arr.length - 1) { [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]]; }
            return { ...t, rows: arr };
          }
          return t;
        }));
      };

      const duplicateRow = (tableId, index) => {
        saveToDb(tables.map(t => {
          if (t.id === tableId) {
            const newRows = [...t.rows];
            const sourceRow = newRows[index];
            newRows.splice(index + 1, 0, { ...sourceRow, id: genId() });
            return { ...t, rows: newRows };
          }
          return t;
        }));
      };

      const moveTable = (idx, visualDir) => {
        const arr = [...tables];
        if (visualDir === 'up' && idx < arr.length - 1) { [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]]; }
        else if (visualDir === 'down' && idx > 0) { [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]]; }
        saveToDb(arr);
      };

      // ── Copy functions ─────────────────────────────────────────────────
      const copyToClipboard = async () => {
        if (!previewRef.current) return;
        try {
          const html = previewRef.current.innerHTML;
          const text = previewRef.current.innerText;
          const data = [new ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([text], { type: 'text/plain' })
          })];
          await navigator.clipboard.write(data);
          setCopySuccess(true);
          setTimeout(() => setCopySuccess(false), 3000);
        } catch (e) {
          const range = document.createRange();
          range.selectNode(previewRef.current);
          window.getSelection().removeAllRanges();
          window.getSelection().addRange(range);
          try {
            document.execCommand('copy');
            setCopySuccess(true);
            setTimeout(() => setCopySuccess(false), 3000);
          } catch(err) { addToast('복사에 실패했습니다.', 'error'); }
          window.getSelection().removeAllRanges();
        }
      };

      const copyHtmlSource = async () => {
        if (!previewRef.current) return;
        try {
          const html = previewRef.current.innerHTML;
          await navigator.clipboard.writeText(html);
          setCopyHtmlSuccess(true);
          setTimeout(() => setCopyHtmlSuccess(false), 3000);
        } catch (e) {
          const textArea = document.createElement("textarea");
          textArea.value = previewRef.current.innerHTML;
          document.body.appendChild(textArea);
          textArea.select();
          try {
            document.execCommand('copy');
            setCopyHtmlSuccess(true);
            setTimeout(() => setCopyHtmlSuccess(false), 3000);
          } catch(err) { addToast('복사에 실패했습니다.', 'error'); }
          document.body.removeChild(textArea);
        }
      };

      // ── Auth ───────────────────────────────────────────────────────────
      const handleLogin = (e) => {
        e.preventDefault();
        if (!loginId || !loginPw) return addToast('아이디(이메일)와 비밀번호를 입력해주세요.');
        firebase.auth().signInWithEmailAndPassword(loginId, loginPw)
          .then(() => { setShowLoginModal(false); setLoginId(''); setLoginPw(''); })
          .catch((error) => { console.error("Login Error:", error); addToast('인증 정보가 올바르지 않습니다.\n(에러: ' + error.message + ')'); });
      };

      const handleLogout = () => {
        firebase.auth().signOut().catch(err => console.error(err));
      };

      // ── Scroll to today ────────────────────────────────────────────────
      const scrollToTodayNearest = () => {
        const now = new Date();
        const curY = now.getFullYear();
        let nearestRowId = null;
        let minDiff = Infinity;
        let prevDateObj = null;

        for (const table of tables) {
           const yrMatch = table.title.match(/(\d{4})년/);
           const y = yrMatch ? parseInt(yrMatch[1], 10) : curY;
           const safeRows = table.rows || [];
           for (let i = 0; i < safeRows.length; i++) {
             const r = safeRows[i];
             let rDateStr = r.date ? r.date.trim() : '';
             if (rDateStr) {
               const mMatch = rDateStr.match(/(\d{1,2})\.(\d{1,2})/);
               if (mMatch) {
                 prevDateObj = new Date(y, parseInt(mMatch[1], 10) - 1, parseInt(mMatch[2], 10));
               } 
             }
             if (!prevDateObj) continue;
             
             let targetDt = new Date(prevDateObj.getTime());
             let h = 0, min = 0;
             if (r.time) {
                const tMatch = r.time.match(/(오전|오후)?\s*(\d{1,2}):(\d{2})/);
                if (tMatch) {
                   h = parseInt(tMatch[2], 10);
                   min = parseInt(tMatch[3], 10);
                   if (tMatch[1] === '오후' && h < 12) h += 12;
                   if (tMatch[1] === '오전' && h === 12) h = 0;
                } else {
                   const tMatch2 = r.time.match(/(\d{1,2})시/);
                   if (tMatch2) h = parseInt(tMatch2[1], 10);
                }
             }
             targetDt.setHours(h, min, 0, 0);
             
             const diff = targetDt.getTime() - now.getTime();
             if (diff >= -7200000 && diff < minDiff) { 
               minDiff = diff;
               nearestRowId = r.id;
             }
           }
        }
        
        if (nearestRowId) {
          const el = document.getElementById(`row-${nearestRowId}`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (viewMode === 'edit') {
              el.classList.add('bg-yellow-100');
              setTimeout(() => el.classList.remove('bg-yellow-100'), 2000);
            } else {
              const origBgs = [];
              Array.from(el.children).forEach((td, idx) => {
                origBgs[idx] = td.style.backgroundColor;
                td.style.transition = 'background-color 1s';
                td.style.backgroundColor = '#fef08a';
              });
              setTimeout(() => {
                Array.from(el.children).forEach((td, idx) => { td.style.backgroundColor = origBgs[idx]; });
              }, 2000);
            }
          }
        } else {
          addToast('예정된 오늘/향후 일정을 찾을 수 없습니다.', 'error');
        }
      };

      // ── Display period check for non-logged-in users ───────────────────
      const isWithinDisplayPeriod = useMemo(() => {
        const now = new Date();
        const start = new Date(displaySettings.display_start);

                      <table className="w-full text-left md:min-w-[700px] block md:table">
                        <thead>
                          <tr className="bg-white border-b border-slate-200 text-slate-500 text-sm">
                            <th className="font-semibold px-4 py-3 w-[15%]">날짜 <span className="font-normal text-slate-400 text-xs ml-1">(비우면 위와 연결)</span></th>
                            <th className="font-semibold px-4 py-3 w-[20%]">시간 <span className="font-normal text-slate-400 text-[11px] tracking-tight ml-1">(24시간제 입력, 종일은 24입력)</span></th>
                            <th className="font-semibold px-4 py-3 w-[40%]">제목</th>
                            <th className="font-semibold px-4 py-3 w-[18%]">담당</th>
                            <th className="font-semibold px-4 py-3 w-[7%] text-center"></th>
                          </tr>
                        </thead>
                        <tbody>
                          {(table.rows || []).map((row, i) => {
                            let inheritedDate = "";
                            for (let j = i - 1; j >= 0; j--) {
                              if ((table.rows || [])[j].date && (table.rows || [])[j].date.trim() !== "") {
                                inheritedDate = (table.rows || [])[j].date.trim();
                                break;
                              }
                            }
                            const monthMatch = table.title.match(/(\d{1,2})월/);
                            const defaultMonthStr = monthMatch ? monthMatch[1].padStart(2, '0') : "01";
                            const datePlaceholder = inheritedDate || `${defaultMonthStr}.15(목)`;

                            return (
                              <tr id={`row-${row.id}`} key={row.id} className="border-b border-slate-100 hover:bg-blue-50/40 group transition-colors duration-1000 bg-white">
                                <td className="p-2">
                                  <input 
                                    value={row.date} 
                                    onChange={e => updateRow(table.id, row.id, 'date', e.target.value)} 
                                    onBlur={(e) => {
                                      const val = e.target.value;
                                      if (!val) return;
                                      let m = '', d = '';
                                      if (val.length === 4 && !isNaN(val)) {
                                        m = val.substring(0,2); d = val.substring(2);
                                      } else if (val.includes('.') && (!val.includes('('))) {
                                        const p = val.split('.'); m = p[0]; d = p[1];
                                      }
                                      if (m && d) {
                                        m = m.padStart(2, '0'); d = d.padStart(2, '0');
                                        const yrMatch = table.title.match(/(\d{4})년/);
                                        const y = yrMatch ? yrMatch[1] : new Date().getFullYear();
                                        const dt = new Date(`${y}-${m}-${d}`);
                                        if (!isNaN(dt.valueOf())) {
                                          const days = ['일','월','화','수','목','금','토'];
                                          updateRow(table.id, row.id, 'date', `${m}.${d}(${days[dt.getDay()]})`);
                                        }
                                      }
                                    }}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-50 transition-all font-medium text-slate-700 focus:bg-blue-50/20" 
                                    placeholder={datePlaceholder} 
                                  />
                                </td>
                                <td className="p-2 align-top">
                                  <input 
                                    id={`time-input-${row.id}`}
                                    value={row.time} 
                                    onChange={e => updateRow(table.id, row.id, 'time', e.target.value)} 
                                    onFocus={() => setActiveTimeRow(row.id)}
                                    onBlur={(e) => {
                                      const val = e.target.value.trim();
                                      let newVal = val;
                                      if (val === "24") {
                                        newVal = "종일";
                                       } else if (/^[\d\s:~\-\.]+$/.test(val)) {
                                        const parseT = (s) => {
                                          let h, m;
                                           if (s.includes('.')) {
                                             const parts = s.split('.');
                                             h = parseInt(parts[0], 10);
                                             m = parts[1] === '5' ? '30' : (parts[1] + '0').substring(0, 2);
                                           } else
                                          if (/^\d{3,4}$/.test(s)) {
                                            h = parseInt(s.substring(0, s.length - 2), 10);
                                            m = s.substring(s.length - 2);
                                          } else if (/^\d{1,2}:\d{2}$/.test(s)) {
                                            const parts = s.split(':');
                                            h = parseInt(parts[0], 10);
                                            m = parts[1];
                                          } else {
                                            h = parseInt(s, 10);
                                            m = "00";
                                          }
                                          if (isNaN(h)) return s;
                                          let period = "오전";
                                          let displayH = h;
                                          if (h === 12) period = "오후";
                                          else if (h >= 13 && h <= 23) { period = "오후"; displayH = h - 12; }
                                          else if (h >= 1 && h <= 7) period = "오후";
                                          else if (h >= 8 && h <= 11) period = "오전";
                                          else if (h === 24 || h === 0) { period = "오전"; displayH = 12; }
                                          return `${period} ${displayH}:${m.padStart(2, '0')}`;
                                        };
                                        const pts = val.split(/\s*[-~]\s*|\s+/).filter(Boolean);
                                        if (pts.length === 1) newVal = parseT(pts[0]);
                                        else if (pts.length >= 2) newVal = `${parseT(pts[0])} ~ ${parseT(pts[1])}`;
                                      }
                                      if (newVal !== val) updateRow(table.id, row.id, 'time', newVal);
                                      setTimeout(() => setActiveTimeRow(null), 150);
                                    }}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-50 transition-all text-slate-600 focus:bg-blue-50/20" 
                                    placeholder="오전 10:00 ~ 12:00" 
                                  />
                                </td>
                                <td className="block md:table-cell px-2 py-2 w-full relative"><div className="md:hidden text-xs font-bold text-slate-400 mb-1 mt-2">일정 제목</div>
                                  <input list="title-suggestions" value={row.title} onChange={e => updateRow(table.id, row.id, 'title', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-50 transition-all font-medium text-slate-800" placeholder="일정 제목" />
                                </td>
                                <td className="block md:table-cell px-2 py-2 w-full relative"><div className="md:hidden text-xs font-bold text-slate-400 mb-1 mt-2">담당 부서</div>
                                  <input list="dept-suggestions" value={row.dept} onChange={e => updateRow(table.id, row.id, 'dept', e.target.value)} 
                                    onKeyDown={(e) => {
                                      if (e.key === 'Enter') {
                                        e.preventDefault();
                                        let nextDateData = {};
                                        if (e.ctrlKey) {
                                          let currentDateStr = row.date && row.date.trim() !== '' ? row.date.trim() : inheritedDate;
                                          if (currentDateStr) {
                                            const m = currentDateStr.match(/(\d{1,2})\.(\d{1,2})/);
                                            if (m) {
                                              let year = new Date().getFullYear();
                                              const yt = table.title.match(/(\d{4})년/);
                                              if (yt) year = parseInt(yt[1], 10);
                                              let month = parseInt(m[1], 10);
                                              let day = parseInt(m[2], 10);
                                              let d = new Date(year, month - 1, day);
                                              d.setDate(d.getDate() + 1);
                                              if (d.getDay() === 6) { d.setDate(d.getDate() + 2); }
                                              else if (d.getDay() === 0) { d.setDate(d.getDate() + 1); }
                                              const days = ['일', '월', '화', '수', '목', '금', '토'];
                                              const newMonth = String(d.getMonth() + 1).padStart(2, '0');
                                              const newDay = String(d.getDate()).padStart(2, '0');
                                              nextDateData.date = `${newMonth}.${newDay}(${days[d.getDay()]})`;
                                            }
                                          }
                                        }
                                        const newId = addRow(table.id, i, nextDateData);
                                        setTimeout(() => {
                                          const el = document.getElementById(`time-input-${newId}`);
                                          if (el) el.focus();
                                        }, 100);
                                      }
                                    }}
                                  className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-50 transition-all text-slate-600" placeholder="담당 부서" />
                                </td>
                                <td className="block md:table-cell px-2 py-2 w-full relative border-t md:border-t-0 mt-3 md:mt-0 pt-3 md:pt-2 border-slate-100">
                                  <div className="flex justify-center gap-0.5 md:opacity-20 group-hover:opacity-100 transition-opacity">
                                    <button tabIndex="-1" onClick={() => addRow(table.id, i)} className="w-7 h-7 rounded text-blue-500 hover:bg-blue-100 flex items-center justify-center transition-colors"><i className="fa-solid fa-plus text-xs"></i></button>
                                    <div className="flex flex-col gap-[2px]">
                                      <button tabIndex="-1" onClick={() => moveRow(table.id, i, 'up')} disabled={i === 0} className="w-5 h-[13px] bg-slate-100 hover:bg-slate-200 rounded-t flex items-center justify-center disabled:opacity-30"><i className="fa-solid fa-caret-up text-[10px] text-slate-600"></i></button>
                                      <button tabIndex="-1" onClick={() => moveRow(table.id, i, 'down')} disabled={i === (table.rows || []).length - 1} className="w-5 h-[13px] bg-slate-100 hover:bg-slate-200 rounded-b flex items-center justify-center disabled:opacity-30"><i className="fa-solid fa-caret-down text-[10px] text-slate-600"></i></button>
                                    </div>
                                    <button tabIndex="-1" onClick={() => duplicateRow(table.id, i)} className="w-7 h-7 rounded text-indigo-500 hover:bg-indigo-100 flex items-center justify-center ml-1 transition-colors" title="이 일정 밑으로 똑같이 복사하기"><i className="fa-regular fa-copy text-sm"></i></button>
                                    <button tabIndex="-1" onClick={() => deleteRow(table.id, row.id)} className="w-7 h-7 rounded text-rose-400 hover:bg-rose-100 flex items-center justify-center ml-1 transition-colors"><i className="fa-solid fa-xmark text-sm"></i></button>
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                    <div className="px-5 py-3 bg-slate-50 border-t border-slate-200">
                      <button onClick={() => addRow(table.id, (table.rows || []).length - 1)} className="text-sm font-bold text-blue-600 hover:bg-blue-100 px-4 py-2 rounded-lg transition-colors inline-flex items-center">
                        <i className="fa-solid fa-plus mr-2"></i> 새 항목 추가
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="animate-fade-in">
                {/* Non-logged-in: display period check */}
                {!isLoggedIn && !isWithinDisplayPeriod && (
                  <div className="text-center py-20">
                    <i className="fa-solid fa-calendar-xmark text-5xl text-slate-300 mb-4 block"></i>
                    <h2 className="text-xl font-bold text-slate-600 mb-2">현재 공개된 일정이 없습니다</h2>
                    <p className="text-slate-400">일정 노출 기간이 아닙니다. 관리자에게 문의하세요.</p>
                  </div>
                )}

                {(isLoggedIn || isWithinDisplayPeriod) && (
                  <>
                    {/* Search Bar Below Title */}
                    <div className="w-full max-w-2xl mx-auto mb-8 relative">
                      <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                      <input 
                        type="text" 
                        placeholder="부서명, 행사 제목, 날짜 키워드로 빠르게 일정을 찾아보세요..." 
                        value={searchQuery}
                        onChange={e => setSearchQuery(e.target.value)}
                        className="w-full pl-12 pr-4 py-3.5 bg-white border border-slate-200 shadow-sm rounded-2xl text-[15px] focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all outline-none font-medium text-slate-700 dark:bg-slate-800 dark:border-slate-700 dark:text-white"
                      />
                    </div>
                    {/* Filter Chips 
                    <div className="flex flex-wrap gap-2 mb-8 justify-center animate-fade-in mx-auto w-full max-w-2xl">
                      {['전체', '총회장', '총무', '교육국', '국내선교', '해외선교', '사회봉사', '선교동역자'].map(chip => (
                        <button 
                          key={chip}
                          onClick={() => setSearchQuery(chip === '전체' ? '' : chip)}
                          className={\`px-4 py-1.5 rounded-full text-sm font-medium transition-all shadow-sm border \${searchQuery === chip || (chip === '전체' && !searchQuery) ? 'bg-blue-600 text-white border-blue-600 dark:bg-blue-500' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300'}\`}
                        >
                          {chip}
                        </button>
                      ))}
                    </div>
                    */}
                    <div className="flex flex-col lg:flex-row gap-8 items-start relative pb-10">
                      {/* Fixed Control Panel */}
                    {isLoggedIn && (
                    <div className="w-full lg:w-72 shrink-0 lg:sticky lg:top-24 space-y-4">
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-xl mb-4">
                          <i className="fa-solid fa-check"></i>
                        </div>
                        <h2 className="text-lg font-bold text-slate-800 mb-2">복사 준비 완료</h2>
                        <p className="text-slate-500 text-sm mb-6 leading-relaxed">
                          우측에 보이는 표를 게시판(카페, 블로그, 그룹웨어)에 바로 붙여넣을 수 있습니다.
                        </p>
                        <button 
                          onClick={copyToClipboard}
                          className={`w-full py-3.5 px-4 rounded-xl font-bold text-white shadow-lg transition-all flex items-center justify-center gap-2 ${copySuccess ? 'bg-emerald-500 scale-[0.98]' : 'bg-blue-600 hover:bg-blue-700 hover:-translate-y-1 hover:shadow-blue-200'}`}
                        >
                          {copySuccess ? (
                            <><i className="fa-solid fa-check-double text-lg"></i> 클립보드 복사됨!</>
                          ) : (
                            <><i className="fa-regular fa-copy text-lg"></i> 일정표 복사하기(위지윅지원)</>
                          )}
                        </button>

                        <button 
                          onClick={copyHtmlSource}
                          className={`w-full mt-3 py-3 px-4 rounded-xl font-bold border-2 transition-all flex items-center justify-center gap-2 ${copyHtmlSuccess ? 'border-emerald-500 text-emerald-600 bg-emerald-50' : 'border-slate-200 text-slate-600 bg-white hover:border-slate-300 hover:bg-slate-50'}`}
                        >
                          {copyHtmlSuccess ? (
                            <><i className="fa-solid fa-check text-lg"></i> 코드 복사 완료!</>
                          ) : (
                            <><i className="fa-solid fa-code text-lg"></i> HTML 코드 복사하기</>
                          )}
                        </button>

                        {(copySuccess || copyHtmlSuccess) && (
                          <p className="text-center text-xs text-emerald-600 font-bold mt-3 animate-fade-in bg-emerald-50 py-2 rounded-lg">
                            이제 게시판 {copyHtmlSuccess ? 'HTML 작성 모드' : '글쓰기 창'}에서<br/>[ Ctrl + V ] 를 누르세요!
                          </p>
                        )}
                      </div>
                      
                      <div className="bg-slate-100 px-5 py-4 rounded-2xl border border-slate-200 text-sm text-slate-600 leading-relaxed">
                        <p className="font-bold text-slate-800 mb-2"><i className="fa-solid fa-circle-info mr-2 text-blue-500"></i>이용 팁</p>
                        <ul className="list-disc pl-5 space-y-2 text-[13px] opacity-80">
                          <li><strong>일정표 복사하기:</strong> 네이버 카페/블로그, 웹메일 등 일반 글쓰기 창에서 [Ctrl+V] 하시면 표 모양 그대로 붙여넣어집니다.</li>
                          <li><strong>HTML 코드 복사하기:</strong> 홈페이지 게시판의 <strong className="text-blue-600">'소스보기(HTML)'</strong> 버튼을 클릭하여 소스 모드로 전환한 뒤 HTML 코드를 붙여넣습니다.</li>
                          <li>날짜를 비워두시면 윗줄과 자연스럽게 연결된 (병합된) 디자인이 자동으로 적용됩니다.</li>
                        </ul>
                      </div>
                    </div>
                    )}

                    {/* Preview Area */}
                    <div className="flex-1 bg-white p-4 sm:p-10 rounded-2xl border border-slate-200 shadow-sm w-full overflow-x-auto">
                      <div ref={previewRef} className="preview-html-container">
                        <div style={{ fontFamily: "'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif", width: "100%", maxWidth: "900px", margin: "0 auto", color: "#111827", lineHeight: "1.4" }}>
                          
                          {tables.map(table => {
                            const lowSearch = searchQuery.toLowerCase();
                            const filteredRows = (table.rows || []).filter(r => 
                              !searchQuery || 
                              (r.title && r.title.toLowerCase().includes(lowSearch)) || 
                              (r.dept && r.dept.toLowerCase().includes(lowSearch)) || 
                              (r.date && r.date.toLowerCase().includes(lowSearch))
                            );
                            if (searchQuery && filteredRows.length === 0) return null;
                            return (
                              <div key={table.id} style={{ marginBottom: "50px" }}>
                                <h3 style={{ fontSize: "17px", fontWeight: "bold", color: "#1e3a8a", paddingBottom: "10px", marginBottom: "12px", borderBottom: "2px solid #1e3a8a", display: "flex", alignItems: "center" }}>
                                  <span style={{ display: "inline-block", width: "5px", height: "16px", backgroundColor: "#1e3a8a", marginRight: "10px", verticalAlign: "middle" }}></span>
                                  {table.title}
                                </h3>
                                <table border="0" cellPadding="0" cellSpacing="0" style={{ width: "100%", borderCollapse: "collapse", textAlign: "center", fontSize: "14px", backgroundColor: "#ffffff" }}>
                                  <thead>
                                    <tr>
                                      <th style={{ width: "16%", padding: "10px 8px", fontWeight: "bold", color: "#334155", backgroundColor: "#f1f5f9", borderTop: "2px solid #1e3a8a", borderBottom: "1px solid #cbd5e1", borderRight: "1px solid #e2e8f0" }}>날짜</th>
                                      <th style={{ width: "24%", padding: "10px 8px", fontWeight: "bold", color: "#334155", backgroundColor: "#f1f5f9", borderTop: "2px solid #1e3a8a", borderBottom: "1px solid #cbd5e1", borderRight: "1px solid #e2e8f0" }}>시간</th>
                                      <th style={{ width: "42%", padding: "10px 8px", fontWeight: "bold", color: "#334155", backgroundColor: "#f1f5f9", borderTop: "2px solid #1e3a8a", borderBottom: "1px solid #cbd5e1", borderRight: "1px solid #e2e8f0" }}>제 목</th>
                                      <th style={{ width: "18%", padding: "10px 8px", fontWeight: "bold", color: "#334155", backgroundColor: "#f1f5f9", borderTop: "2px solid #1e3a8a", borderBottom: "1px solid #cbd5e1" }}>담 당</th>
                                    </tr>
                                  </thead>
                                  <tbody>
                                    {filteredRows.map((row, i) => {
                                      const myActualDate = row.date ? row.date.trim() : '';
                                      let showDate = true;
                                      let displayDateStr = myActualDate;
                                      let lastSeenDate = '';
                                      for (let j = i - 1; j >= 0; j--) {
                                        if (filteredRows[j].date && filteredRows[j].date.trim() !== '') {
                                          lastSeenDate = filteredRows[j].date.trim();
                                          break;
                                        }
                                      }
                                      if (i > 0) { if (!myActualDate || myActualDate === lastSeenDate) { showDate = false; } }
                                      else { if (!myActualDate) showDate = false; }
                                      if (showDate && !myActualDate) displayDateStr = '';
                                      const isLast = i === filteredRows.length - 1;
                                      const rowBg = i % 2 === 0 ? "#ffffff" : "#f8fafc";
                                      const bottomBorder = isLast ? "2px solid #1e3a8a" : "1px solid #e2e8f0";
                                      return (
                                        <tr id={`row-${row.id}`} key={row.id}>
                                          <td style={{ padding: "10px 8px", borderRight: "1px solid #e2e8f0", borderBottom: bottomBorder, backgroundColor: rowBg, fontWeight: "bold", color: "#1e3a8a", borderTop: showDate ? "1px solid #cbd5e1" : "1px dashed #e2e8f0", verticalAlign: "middle" }}>
                                            {showDate ? displayDateStr : ''}
                                          </td>
                                          <td style={{ padding: "10px 8px", borderRight: "1px solid #e2e8f0", borderBottom: bottomBorder, backgroundColor: rowBg, color: "#475569", verticalAlign: "middle", fontSize: "13px" }}>
                                            {row.time}
                                          </td>
                                          <td style={{ padding: "10px 8px", borderRight: "1px solid #e2e8f0", borderBottom: bottomBorder, backgroundColor: rowBg, textAlign: "left", color: "#1e293b", fontWeight: "600", verticalAlign: "middle" }}>
                                            {row.title}
                                          </td>
                                          <td style={{ padding: "10px 8px", borderBottom: bottomBorder, backgroundColor: rowBg, color: "#475569", verticalAlign: "middle", fontSize: "13px" }}>
                                            {row.dept}
                                          </td>
                                        </tr>
                                      );
                                    })}
                                  </tbody>
                                </table>
                              </div>
                            );
                          })}
                          
                          <div style={{ marginTop: "15px", fontSize: "12px", color: "#9ca3af", textAlign: "right" }}>
                            ※ 단, 상기 일정은 사정에 따라 변경될 수 있습니다.
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  </>
                )}
              </div>
            )}
            
            {/* Toast Container */}
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none">
              {toasts.map(toast => (
                <div key={toast.id} className={`font-medium text-sm px-6 py-3 rounded-full flex items-center gap-3 shadow-xl transition-all animate-fade-in ${toast.type === 'error' ? 'bg-rose-500 text-white' : 'bg-slate-800 text-white'}`}>
                  <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-check'}`}></i>
                  {toast.message}
                </div>
              ))}
            </div>
            <datalist id="title-suggestions">
              {allTitles.map((t, idx) => <option key={idx} value={t} />)}
            </datalist>
            <datalist id="dept-suggestions">
              {allDepts.map((d, idx) => <option key={idx} value={d} />)}
            </datalist>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Unregister Service Worker to prevent caching during development
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
          console.log('ServiceWorker unregistered');
        }
      });
    }
  </script>

</body>
</html>
